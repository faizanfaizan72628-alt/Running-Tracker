<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
<header>
    <h1>🏃Running Tracker</h1>
    <p>Track your running activity</p>
</header>
<div class="main-card">
    <div class="status">
        <span id="status">Ready to Run</span>
    </div>
    <div class="timer">
        <h2 id="timer">00:00:00</h2>
        <p>Running Time</p>
    </div>
<div class="stats">
    <div class="stat-card">
        <span>👟</span>
        <h3 id="steps">0</h3>
        <p>steps</p>
    </div>
    <div class="stat-card">
     <span>📍</span>
    <h3 id="distance">0.00</h3>
     <p>Distance (km)</p>
    </div>
    <div class="stat-card">
    <span>🚀</span>
    <h3 id="speed">0.00</h3>
    <p>Speed (km/h)</p>
    </div>
    <div class="stat-card">
    <span>🔥</span>
    <h3 id="calories">0</h3>
    <p>Calories</p>
    </div>
</div>
 <div class="goal">
<div class="goal-header">
<h3>🎯 Daily Goal</h3>
<span id="goalText">0%</span>
</div>
<div class="progress-container">
 <div id="progress"></div>
</div>
<p>Goal: 5 km</p>
 </div>
            <div class="buttons">
<button id="startBtn">▶ Start Run</button>
<button id="stopBtn">⏹ Stop</button>
<button id="resetBtn">🔄 Reset</button>
            </div>
    </div>
        <footer>
            <p>Made with HTML, CSS & JavaScript ❤️</p>
        </footer>
    </div>
    <script src="script.js"></script>
</div>
<script src="script.js"></script>
</body>
</html>
